name: Update Structurizr

# on:
#   push:
#     branches: ["main"]
#   pull_request:
#     branches: ["main"]

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    # Structurizr image is "distroless," it lacks the shell needed for the Action runner
    #  to initialize, so you cannot use it in the container: directive
    # container:
    #   image: structurizr/structurizr:latest
    # --> So we have to run directly the docker run commands

    steps:
        - uses: actions/checkout@v3

        - name: Validate Structurizr workspace
          run: |
            docker run --rm \
            -u $(id -u):$(id -g) \
            -v ${{ github.workspace }}:/usr/local/structurizr \
            structurizr/structurizr validate \
            -workspace /usr/local/structurizr/dsl/02-ai4eosc/workspace.dsl

        - name: Export workspace to static HTML files
          run: |
            docker run --rm \
            -u $(id -u):$(id -g) \
            -v ${{ github.workspace }}:/usr/local/structurizr \
            structurizr/structurizr export \
            -workspace /usr/local/structurizr/dsl/02-ai4eosc/workspace.dsl \
            -format static \
            -output /usr/local/structurizr/static-diagrams/static

        - name: Export workspace to static JSON files (before pushing)
          run: |
            docker run --rm \
            -u $(id -u):$(id -g) \
            -v ${{ github.workspace }}:/usr/local/structurizr \
            structurizr/structurizr export \
            -workspace /usr/local/structurizr/dsl/02-ai4eosc/workspace.dsl \
            -format json \
            -output /usr/local/structurizr/dsl/02-ai4eosc/

        - name: Push to Structurizr server
          if: ${{ github.event_name == 'push' }}
          run: |
            curl -v -X PUT \
                -u "${{ secrets.BASIC_AUTH_USER }}:${{ secrets.BASIC_AUTH_PASS }}" \
                -H "Content-Type: application/json; charset=UTF-8" \
                -T ./dsl/02-ai4eosc/workspace.json \
                https://structurizr.k8s.cloud.ai4eosc.eu/api/workspace/${{ secrets.WORKSPACE_ID }}